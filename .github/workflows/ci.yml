# Checks every change before it can be merged: server tests + typechecks for app and server.
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Server — typecheck + 42 tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run check

  app:
    name: App — typecheck + web build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo export --platform web --output-dir /tmp/web-check
